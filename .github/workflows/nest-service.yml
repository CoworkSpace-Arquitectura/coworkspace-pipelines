name: Pipeline de microservicio NestJS

on:
  workflow_call:
    inputs:
      service-name:
        description: Nombre del microservicio
        type: string
        required: true
      node-version:
        type: string
        default: '24'
    secrets:
      RENDER_DEPLOY_HOOK_URL:
        required: false

jobs:
  test:
    name: Lint, build, pruebas y cobertura
    runs-on: ubuntu-latest

    # Base de datos y bus de eventos desechables, solo para las pruebas de integración
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coworkspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coworkspace_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        if: hashFiles('prisma/schema.prisma') != ''
        run: npx prisma generate

      - name: Crear las tablas en la base de prueba (migraciones)
        if: hashFiles('prisma/schema.prisma') != ''
        run: npx prisma migrate deploy

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias y de integración con cobertura
        run: >-
          npx vitest run --coverage
          --coverage.include='src/**/*.ts'
          --coverage.exclude='src/**/*.spec.ts'
          --coverage.exclude='src/main.ts'
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json-summary

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (n, m) => `| ${n} | ${m.covered}/${m.total} | ${m.pct} % |`;
            const md = [
              "## Cobertura de ${{ inputs.service-name }}",
              "| Métrica | Cubierto | % |", "|---|---|---|",
              row("Líneas", t.lines), row("Sentencias", t.statements),
              row("Funciones", t.functions), row("Ramas", t.branches),
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            console.log(md);
          '

      - name: Guardar el reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ inputs.service-name }}
          path: coverage/
          if-no-files-found: ignore

  docker:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Desplegar en Render
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL no está configurado; se omite el despliegue de ${{ inputs.service-name }}."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Despliegue de ${{ inputs.service-name }} solicitado a Render."
